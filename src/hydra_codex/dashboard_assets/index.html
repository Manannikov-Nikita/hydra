<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydra Evidence Desk</title>
  <script src="/assets/bootstrap.js"></script>
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to evidence</a>
  <header class="app-topbar">
    <div class="brand">Hydra</div>
    <div class="topbar-actions">
      <span id="freshness-label" class="muted">Opening evidence desk</span>
      <button id="sync-button" class="button primary" type="button">Sync now</button>
      <button id="repair-button" class="button ghost" type="button" aria-expanded="false" aria-controls="repair-confirmation">Repair history</button>
      <button id="theme-button" class="button ghost" type="button" aria-label="Switch theme">Theme</button>
    </div>
  </header>
  <div class="app-layout">
    <aside class="project-rail">
      <h2>Projects</h2>
      <nav aria-label="Projects" id="project-navigation"></nav>
      <h2>Dashboard</h2>
      <nav aria-label="Dashboard" id="route-navigation"></nav>
    </aside>
    <main id="main-content" tabindex="-1">
      <div class="project-select-region">
        <label for="project-select">Project</label>
        <select id="project-select"></select>
      </div>
      <p id="route-status" class="route-status"></p>
      <p id="repair-confirmation" class="route-status" hidden>Full repair scans telemetry history across every Hydra project, may inspect thousands of files, may take a long time, and may still finish partial. It is not required to view the current report. <button id="repair-confirm-button" class="button ghost" type="button">Start global repair</button></p>
      <div id="async-status" class="async-status" tabindex="-1"></div>
      <div id="route-view"></div>
    </main>
  </div>
  <div id="global-live-region" class="sr-only" aria-live="polite"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
