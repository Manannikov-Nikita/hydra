{
  "name": "Release",
  "on": {
    "push": {
      "tags": [
        "v*"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "hydra-release-publish",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify": {
      "name": "Verify release identity",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        # reviewed: actions/checkout v7.0.1
        {"name": "Checkout tagged source", "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"fetch-depth": 0, "persist-credentials": false, "ref": "${{ github.sha }}"}},
        # reviewed: actions/setup-python v7.0.0
        {"name": "Set up Python", "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97", "with": {"python-version": "3.12"}},
        {
          "name": "Verify exact release tag",
          "shell": "bash",
          "run": "set -euo pipefail\nversion=\"${GITHUB_REF_NAME#v}\"\nif [[ ! \"$version\" =~ ^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$ ]]; then\n  printf 'release tag is not canonical semver\\n' >&2\n  exit 1\nfi\npackage_version=\"$(PYTHONPATH=src python -c 'import hydra_codex; print(hydra_codex.__version__)')\"\n[ \"$GITHUB_REF_NAME\" = \"v$package_version\" ]\ntag_commit=\"$(git rev-parse \"$GITHUB_REF_NAME^{commit}\")\"\nhead_commit=\"$(git rev-parse HEAD)\"\n[ \"$tag_commit\" = \"$head_commit\" ]\n[ \"$head_commit\" = \"$GITHUB_SHA\" ]\n[ -z \"$(git status --porcelain --untracked-files=all)\" ]"
        }
      ]
    },
    "build": {
      "name": "Build (${{ matrix.target }})",
      "needs": [
        "verify"
      ],
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 90,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "runner": "macos-15",
              "target": "darwin-arm64"
            },
            {
              "runner": "macos-15-intel",
              "target": "darwin-x86_64"
            },
            {
              "runner": "ubuntu-24.04",
              "target": "linux-x86_64"
            }
          ]
        }
      },
      "steps": [
        # reviewed: actions/checkout v7.0.1
        {"name": "Checkout tagged source", "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"fetch-depth": 0, "persist-credentials": false, "ref": "${{ github.sha }}"}},
        # reviewed: actions/setup-python v7.0.0
        {"name": "Set up Python", "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97", "with": {"python-version": "3.12"}},
        {
          "name": "Verify native runner architecture",
          "shell": "bash",
          "run": "set -euo pipefail\nactual=\"$(uname -s)/$(uname -m)\"\ncase \"${{ matrix.target }}\" in\n  darwin-arm64) expected=\"Darwin/arm64\" ;;\n  darwin-x86_64) expected=\"Darwin/x86_64\" ;;\n  linux-x86_64) expected=\"Linux/x86_64\" ;;\n  *) exit 1 ;;\nesac\n[ \"$actual\" = \"$expected\" ]"
        },
        {
          "name": "Install test and release tooling",
          "run": "python -m pip install --only-binary=:all: --require-hashes -r requirements/release-tools.txt"
        },
        {
          "name": "Run full source suite",
          "run": "env PYTHONPATH=\"$PWD/src\" python -m unittest discover -s tests -t ."
        },
        {
          "name": "Build and accept native standalone archive",
          "shell": "bash",
          "run": "set -euo pipefail\nrm -rf build/standalone\npython packaging/build_standalone.py --source-root \"$PWD\" --output build/standalone --target \"${{ matrix.target }}\"\narchive_count=\"$(find build/standalone -maxdepth 1 -type f -name 'hydra-codex-*.tar.gz' | wc -l | tr -d ' ')\"\n[ \"$archive_count\" = 1 ]\narchive=\"$(find build/standalone -maxdepth 1 -type f -name 'hydra-codex-*.tar.gz' -print)\"\ncase \"$archive\" in\n  *-\"${{ matrix.target }}\".tar.gz) ;;\n  *) exit 1 ;;\nesac\nsh packaging/accept_standalone.sh \"$archive\""
        },
        # reviewed: actions/upload-artifact v7.0.1
        {"name": "Upload accepted standalone archive", "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a", "with": {"name": "hydra-standalone-${{ matrix.target }}", "path": "build/standalone/hydra-codex-*.tar.gz", "if-no-files-found": "error", "retention-days": 7}}
      ]
    },
    "publish": {
      "name": "Attest and publish release",
      "needs": [
        "build"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "artifact-metadata": "write",
        "attestations": "write",
        "contents": "write",
        "id-token": "write"
      },
      "steps": [
        # reviewed: actions/checkout v7.0.1
        {"name": "Checkout tagged source", "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"fetch-depth": 0, "persist-credentials": false, "ref": "${{ github.sha }}"}},
        # reviewed: actions/setup-python v7.0.0
        {"name": "Set up Python", "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97", "with": {"python-version": "3.12"}},
        # reviewed: actions/download-artifact v8.0.1
        {"name": "Download darwin-arm64", "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", "with": {"name": "hydra-standalone-darwin-arm64", "path": "downloads/darwin-arm64"}},
        # reviewed: actions/download-artifact v8.0.1
        {"name": "Download darwin-x86_64", "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", "with": {"name": "hydra-standalone-darwin-x86_64", "path": "downloads/darwin-x86_64"}},
        # reviewed: actions/download-artifact v8.0.1
        {"name": "Download linux-x86_64", "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", "with": {"name": "hydra-standalone-linux-x86_64", "path": "downloads/linux-x86_64"}},
        {
          "name": "Verify remote tag at event commit",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\nexport HYDRA_REMOTE_TAG_ENDPOINT=\"repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME\"\npython -I - <<'PY'\nimport json\nimport os\nimport subprocess\n\nrepository = os.environ['GITHUB_REPOSITORY']\nexpected_commit = os.environ['GITHUB_SHA']\nendpoint = os.environ['HYDRA_REMOTE_TAG_ENDPOINT']\npayload = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))\nobject_value = payload.get('object')\nseen = set()\nfor _ in range(8):\n    if not isinstance(object_value, dict):\n        raise SystemExit('remote tag object is invalid')\n    object_type = object_value.get('type')\n    object_sha = object_value.get('sha')\n    if not isinstance(object_sha, str) or len(object_sha) != 40:\n        raise SystemExit('remote tag object is invalid')\n    if object_type == 'commit':\n        break\n    if object_type != 'tag' or object_sha in seen:\n        raise SystemExit('remote tag does not peel to a commit')\n    seen.add(object_sha)\n    endpoint = f'repos/{repository}/git/tags/{object_sha}'\n    payload = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))\n    object_value = payload.get('object')\nelse:\n    raise SystemExit('remote tag peel depth exceeded')\nif object_type != 'commit' or object_sha != expected_commit:\n    raise SystemExit('remote tag does not match event commit')\nPY"
        },
        {
          "name": "Aggregate exact release assets",
          "shell": "bash",
          "run": "set -euo pipefail\npython -I - <<'PY'\nfrom hashlib import sha256\nfrom pathlib import Path\nimport os\nimport re\nimport shutil\n\ntag = os.environ['GITHUB_REF_NAME']\nmatch = re.fullmatch(r'v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)', tag)\nif match is None:\n    raise SystemExit('release tag is not canonical semver')\nversion = tag[1:]\ntargets = ('darwin-arm64', 'darwin-x86_64', 'linux-x86_64')\nexpected_names = tuple(f'hydra-codex-{version}-{target}.tar.gz' for target in targets)\ndestination = Path('dist')\nif destination.exists():\n    raise SystemExit('release destination already exists')\ndestination.mkdir()\nfor target, expected_name in zip(targets, expected_names, strict=True):\n    source_directory = Path('downloads') / target\n    if not source_directory.is_dir() or source_directory.is_symlink():\n        raise SystemExit('unexpected release artifact inventory')\n    inventory = list(source_directory.iterdir())\n    if (\n        len(inventory) != 1\n        or inventory[0].name != expected_name\n        or not inventory[0].is_file()\n        or inventory[0].is_symlink()\n    ):\n        raise SystemExit('unexpected release artifact inventory')\n    shutil.copy2(inventory[0], destination / expected_name, follow_symlinks=False)\nif any(path.is_symlink() or not path.is_file() for path in destination.iterdir()):\n    raise SystemExit('unexpected release artifact inventory')\nif sorted(path.name for path in destination.iterdir()) != sorted(expected_names):\n    raise SystemExit('unexpected release artifact inventory')\nchecksums = [\n    f'{sha256((destination / name).read_bytes()).hexdigest()}  {name}'\n    for name in sorted(expected_names)\n]\n(destination / 'SHA256SUMS').write_text('\\n'.join(checksums) + '\\n', encoding='ascii')\nPY"
        },
        {
          "name": "Require newer stable release",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\nlatest_json=\"$RUNNER_TEMP/hydra-latest-release.json\"\nprobe=\"$RUNNER_TEMP/hydra-latest-release-response\"\nendpoint=\"repos/$GITHUB_REPOSITORY/releases/latest\"\nset +e\ngh api --include \"$endpoint\" > \"$probe\" 2>&1\nprobe_code=$?\nset -e\nstatus=\"$(sed -n 's/^HTTP\\/[^ ]* \\([0-9][0-9][0-9]\\).*/\\1/p' \"$probe\" | tail -1)\"\ncase \"$status/$probe_code\" in\n  200/0)\n    gh api \"$endpoint\" > \"$latest_json\"\n    python -I - \"$latest_json\" \"$GITHUB_REF_NAME\" <<'PY'\nfrom pathlib import Path\nimport json\nimport re\nimport sys\n\npattern = re.compile(r'v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)')\npayload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\ncurrent_match = pattern.fullmatch(sys.argv[2])\nlatest_tag = payload.get('tag_name')\nlatest_match = pattern.fullmatch(latest_tag) if isinstance(latest_tag, str) else None\nif (\n    current_match is None\n    or latest_match is None\n    or payload.get('draft') is not False\n    or payload.get('prerelease') is not False\n):\n    raise SystemExit('latest stable release state is invalid')\ncurrent_version = tuple(int(part) for part in current_match.groups())\nlatest_version = tuple(int(part) for part in latest_match.groups())\nif current_version <= latest_version:\n    if (\n        current_version != latest_version\n        or latest_tag != sys.argv[2]\n        or payload.get('immutable') is not True\n    ):\n        raise SystemExit('release version must be newer than latest stable release')\nPY\n    ;;\n  404/*) ;;\n  *) printf 'latest release lookup failed\\n' >&2; exit 1 ;;\nesac"
        },
        {
          "name": "Require absent or draft release",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\nrelease_json=\"$RUNNER_TEMP/hydra-release-preflight.json\"\nprobe=\"$RUNNER_TEMP/hydra-release-preflight-response\"\nendpoint=\"repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME\"\nset +e\ngh api --include \"$endpoint\" > \"$probe\" 2>&1\nprobe_code=$?\nset -e\nstatus=\"$(sed -n 's/^HTTP\\/[^ ]* \\([0-9][0-9][0-9]\\).*/\\1/p' \"$probe\" | tail -1)\"\ncase \"$status/$probe_code\" in\n  200/0) gh api \"$endpoint\" > \"$release_json\" ;;\n  404/*)\n    release_pages=\"${probe}.pages\"\n    gh api --paginate --slurp \"repos/$GITHUB_REPOSITORY/releases?per_page=100\" > \"$release_pages\"\n    python -I - \"$release_pages\" \"$GITHUB_REF_NAME\" \"$release_json\" <<'PY'\nfrom pathlib import Path\nimport json\nimport sys\n\npages = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\ntag = sys.argv[2]\nif not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):\n    raise SystemExit('release list response is invalid')\nmatches = []\nfor page in pages:\n    for release in page:\n        if not isinstance(release, dict) or not isinstance(release.get('tag_name'), str):\n            raise SystemExit('release list response is invalid')\n        if release['tag_name'] == tag:\n            matches.append(release)\nif len(matches) > 1:\n    raise SystemExit('release tag is ambiguous')\nif matches:\n    release = matches[0]\n    release_id = release.get('id')\n    if (\n        isinstance(release_id, bool)\n        or not isinstance(release_id, int)\n        or release_id <= 0\n        or not isinstance(release.get('draft'), bool)\n        or not isinstance(release.get('prerelease'), bool)\n        or not isinstance(release.get('assets'), list)\n    ):\n        raise SystemExit('release candidate is invalid')\n    Path(sys.argv[3]).write_text(json.dumps(release), encoding='utf-8')\nPY\n    ;;\n  *) printf 'release lookup failed\\n' >&2; exit 1 ;;\nesac\nif [ -s \"$release_json\" ]; then\n  python -I - \"$release_json\" \"$GITHUB_REF_NAME\" \"$RUNNER_TEMP/hydra-latest-release.json\" <<'PY'\nfrom pathlib import Path\nimport json\nimport sys\n\npayload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\nif payload.get('tag_name') != sys.argv[2]:\n    raise SystemExit('release tag mismatch')\nif payload.get('prerelease') is not False:\n    raise SystemExit('published releases are immutable; prerelease is not allowed')\nif payload.get('draft') is True:\n    pass\nelif payload.get('draft') is False and payload.get('immutable') is True:\n    latest_path = Path(sys.argv[3])\n    if not latest_path.is_file():\n        raise SystemExit('published release recovery is not latest')\n    latest = json.loads(latest_path.read_text(encoding='utf-8'))\n    if (\n        latest.get('id') != payload.get('id')\n        or latest.get('tag_name') != sys.argv[2]\n        or latest.get('draft') is not False\n        or latest.get('prerelease') is not False\n        or latest.get('immutable') is not True\n    ):\n        raise SystemExit('published release recovery is not latest')\nelse:\n    raise SystemExit('published releases are immutable; prerelease is not allowed')\nPY\nfi"
        },
        # reviewed: actions/attest v4.2.0
        {"name": "Attest standalone archives", "uses": "actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6", "with": {"subject-checksums": "dist/SHA256SUMS"}},
        # reviewed: actions/attest v4.2.0
        {"name": "Attest checksum manifest", "uses": "actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6", "with": {"subject-path": "dist/SHA256SUMS"}},
        {
          "name": "Reconcile draft release assets",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\nrelease_json=\"$RUNNER_TEMP/hydra-release.json\"\nresolve_release() {\n  destination=\"$1\"\n  probe=\"$2\"\n  endpoint=\"repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME\"\n  set +e\n  gh api --include \"$endpoint\" > \"$probe\" 2>&1\n  probe_code=$?\n  set -e\n  status=\"$(sed -n 's/^HTTP\\/[^ ]* \\([0-9][0-9][0-9]\\).*/\\1/p' \"$probe\" | tail -1)\"\n  case \"$status/$probe_code\" in\n    200/0) gh api \"$endpoint\" > \"$destination\" ;;\n    404/*)\n      release_pages=\"${probe}.pages\"\n      gh api --paginate --slurp \"repos/$GITHUB_REPOSITORY/releases?per_page=100\" > \"$release_pages\"\n      python -I - \"$release_pages\" \"$GITHUB_REF_NAME\" \"$destination\" <<'PY'\nfrom pathlib import Path\nimport json\nimport sys\n\npages = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\ntag = sys.argv[2]\nif not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):\n    raise SystemExit('release list response is invalid')\nmatches = []\nfor page in pages:\n    for release in page:\n        if not isinstance(release, dict) or not isinstance(release.get('tag_name'), str):\n            raise SystemExit('release list response is invalid')\n        if release['tag_name'] == tag:\n            matches.append(release)\nif len(matches) > 1:\n    raise SystemExit('release tag is ambiguous')\nif matches:\n    release = matches[0]\n    release_id = release.get('id')\n    if (\n        isinstance(release_id, bool)\n        or not isinstance(release_id, int)\n        or release_id <= 0\n        or not isinstance(release.get('draft'), bool)\n        or not isinstance(release.get('prerelease'), bool)\n        or not isinstance(release.get('assets'), list)\n    ):\n        raise SystemExit('release candidate is invalid')\n    Path(sys.argv[3]).write_text(json.dumps(release), encoding='utf-8')\nPY\n      ;;\n    *) printf 'release lookup failed\\n' >&2; exit 1 ;;\n  esac\n}\nresolve_release \"$release_json\" \"$RUNNER_TEMP/hydra-release-response\"\nif [ ! -s \"$release_json\" ]; then\n  gh release create \"$GITHUB_REF_NAME\" --draft --verify-tag --title \"$GITHUB_REF_NAME\" --generate-notes\n  resolve_release \"$release_json\" \"$RUNNER_TEMP/hydra-release-created-response\"\n  if [ ! -s \"$release_json\" ]; then\n    printf 'created draft release was not found\\n' >&2\n    exit 1\n  fi\nfi\nremote_assets=\"$RUNNER_TEMP/hydra-remote-assets\"\nrelease_metadata=\"$RUNNER_TEMP/hydra-release-metadata\"\nrelease_state=\"$RUNNER_TEMP/hydra-release-state\"\npython -I - \"$release_json\" \"$GITHUB_REF_NAME\" \"$GITHUB_REPOSITORY\" \"$remote_assets\" \"$release_metadata\" \"$release_state\" <<'PY'\nfrom pathlib import Path\nimport json\nimport re\nimport sys\n\npayload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\ntag = sys.argv[2]\nrepository = sys.argv[3]\nmatch = re.fullmatch(r'v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)', tag)\nif match is None or payload.get('tag_name') != tag:\n    raise SystemExit('release tag mismatch')\nif payload.get('prerelease') is not False:\n    raise SystemExit('prerelease is not allowed')\nrelease_id = payload.get('id')\nif isinstance(release_id, bool) or not isinstance(release_id, int) or release_id <= 0:\n    raise SystemExit('release candidate is invalid')\nif payload.get('draft') is True:\n    release_state = 'draft'\n    upload_url = f'https://uploads.github.com/repos/{repository}/releases/{release_id}/assets'\n    if payload.get('upload_url') != f'{upload_url}{{?name,label}}':\n        raise SystemExit('release upload URL is invalid')\nelif payload.get('draft') is False and payload.get('immutable') is True:\n    release_state = 'published'\n    upload_url = ''\nelse:\n    raise SystemExit('release must be a draft or an immutable published release')\nversion = tag[1:]\nexpected = {\n    *(f'hydra-codex-{version}-{target}.tar.gz' for target in (\n        'darwin-arm64', 'darwin-x86_64', 'linux-x86_64'\n    )),\n    'SHA256SUMS',\n}\nassets = payload.get('assets')\nif not isinstance(assets, list):\n    raise SystemExit('remote release asset inventory is invalid')\nvalidated = []\nfor asset in assets:\n    if not isinstance(asset, dict):\n        raise SystemExit('remote release asset inventory is invalid')\n    name = asset.get('name')\n    asset_id = asset.get('id')\n    if (\n        not isinstance(name, str)\n        or name not in expected\n        or isinstance(asset_id, bool)\n        or not isinstance(asset_id, int)\n        or asset_id <= 0\n    ):\n        raise SystemExit('remote release asset inventory is invalid')\n    validated.append((name, asset_id))\nif len(validated) != len({name for name, _ in validated}) or len(validated) != len({asset_id for _, asset_id in validated}):\n    raise SystemExit('remote release asset inventory is invalid')\nif release_state == 'published' and {name for name, _ in validated} != expected:\n    raise SystemExit('published release asset inventory is incomplete')\nPath(sys.argv[4]).write_text(''.join(f'{asset_id}\\t{name}\\n' for name, asset_id in sorted(validated)), encoding='ascii')\nPath(sys.argv[5]).write_text(f'{release_id}\\t{upload_url}\\n', encoding='ascii')\nPath(sys.argv[6]).write_text(f'{release_state}\\n', encoding='ascii')\nPY\nremote_names=\"$RUNNER_TEMP/hydra-remote-names\"\ncut -f2 \"$remote_assets\" > \"$remote_names\"\nIFS=$'\\t' read -r release_id upload_url < \"$release_metadata\"\nif [ \"$(cat \"$release_state\")\" = \"draft\" ]; then\n  case \"$upload_url\" in\n    \"https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets\") ;;\n    *) printf 'release upload URL is invalid\\n' >&2; exit 1 ;;\n  esac\nfi\nremote_dir=\"$RUNNER_TEMP/hydra-existing-assets\"\nrm -rf \"$remote_dir\"\nmkdir \"$remote_dir\"\nwhile IFS=$'\\t' read -r asset_id name; do\n  gh api -H \"Accept: application/octet-stream\" -H \"X-GitHub-Api-Version: 2022-11-28\" \"repos/$GITHUB_REPOSITORY/releases/assets/$asset_id\" > \"$remote_dir/$name\"\ndone < \"$remote_assets\"\nif [ -s \"$remote_names\" ]; then\n  python -I - \"$remote_names\" \"$remote_dir\" dist <<'PY'\nfrom hashlib import sha256\nfrom pathlib import Path\nimport sys\n\nnames = Path(sys.argv[1]).read_text(encoding='ascii').splitlines()\nremote = Path(sys.argv[2])\nlocal = Path(sys.argv[3])\ninventory = list(remote.iterdir())\nif (\n    sorted(path.name for path in inventory) != sorted(names)\n    or any(path.is_symlink() or not path.is_file() for path in inventory)\n):\n    raise SystemExit('remote release asset inventory is invalid')\nfor name in names:\n    if sha256((remote / name).read_bytes()).digest() != sha256((local / name).read_bytes()).digest():\n        raise SystemExit('remote asset checksum mismatch')\nPY\nfi\nif [ \"$(cat \"$release_state\")\" = \"published\" ]; then\n  exit 0\nfi\nversion=\"${GITHUB_REF_NAME#v}\"\nfor name in \\\n  \"hydra-codex-$version-darwin-arm64.tar.gz\" \\\n  \"hydra-codex-$version-darwin-x86_64.tar.gz\" \\\n  \"hydra-codex-$version-linux-x86_64.tar.gz\" \\\n  SHA256SUMS\ndo\n  if ! grep -Fqx \"$name\" \"$remote_names\"; then\n    upload_response=\"$RUNNER_TEMP/hydra-upload-$name.json\"\n    curl --fail-with-body --silent --show-error --request POST \\\n      --header \"Authorization: Bearer $GH_TOKEN\" \\\n      --header \"Accept: application/vnd.github+json\" \\\n      --header \"X-GitHub-Api-Version: 2022-11-28\" \\\n      --header \"Content-Type: application/octet-stream\" \\\n      --data-binary \"@dist/$name\" \\\n      \"${upload_url}?name=$name\" > \"$upload_response\"\n    python -I - \"$upload_response\" \"$name\" <<'PY'\nfrom pathlib import Path\nimport json\nimport sys\n\npayload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\nasset_id = payload.get('id')\nif (\n    payload.get('name') != sys.argv[2]\n    or isinstance(asset_id, bool)\n    or not isinstance(asset_id, int)\n    or asset_id <= 0\n):\n    raise SystemExit('uploaded asset response is invalid')\nPY\n  fi\ndone"
        },
        {
          "name": "Verify and publish release",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\ntag_commit=\"$(git rev-parse \"$GITHUB_REF_NAME^{commit}\")\"\nhead_commit=\"$(git rev-parse HEAD)\"\n[ \"$tag_commit\" = \"$head_commit\" ]\n[ \"$head_commit\" = \"$GITHUB_SHA\" ]\nversion=\"${GITHUB_REF_NAME#v}\"\nif [[ ! \"$version\" =~ ^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$ ]]; then\n  printf 'release tag is not canonical semver\\n' >&2\n  exit 1\nfi\ngit diff --quiet\ngit diff --cached --quiet\nexport HYDRA_REMOTE_TAG_ENDPOINT=\"repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME\"\npython -I - <<'PY'\nimport json\nimport os\nimport subprocess\n\nrepository = os.environ['GITHUB_REPOSITORY']\nexpected_commit = os.environ['GITHUB_SHA']\nendpoint = os.environ['HYDRA_REMOTE_TAG_ENDPOINT']\npayload = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))\nobject_value = payload.get('object')\nseen = set()\nfor _ in range(8):\n    if not isinstance(object_value, dict):\n        raise SystemExit('remote tag object is invalid')\n    object_type = object_value.get('type')\n    object_sha = object_value.get('sha')\n    if not isinstance(object_sha, str) or len(object_sha) != 40:\n        raise SystemExit('remote tag object is invalid')\n    if object_type == 'commit':\n        break\n    if object_type != 'tag' or object_sha in seen:\n        raise SystemExit('remote tag does not peel to a commit')\n    seen.add(object_sha)\n    endpoint = f'repos/{repository}/git/tags/{object_sha}'\n    payload = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))\n    object_value = payload.get('object')\nelse:\n    raise SystemExit('remote tag peel depth exceeded')\nif object_type != 'commit' or object_sha != expected_commit:\n    raise SystemExit('remote tag does not match event commit')\nPY\nlatest_json=\"$RUNNER_TEMP/hydra-latest-release-final.json\"\nlatest_probe=\"$RUNNER_TEMP/hydra-latest-release-final-response\"\nlatest_endpoint=\"repos/$GITHUB_REPOSITORY/releases/latest\"\nset +e\ngh api --include \"$latest_endpoint\" > \"$latest_probe\" 2>&1\nlatest_probe_code=$?\nset -e\nlatest_status=\"$(sed -n 's/^HTTP\\/[^ ]* \\([0-9][0-9][0-9]\\).*/\\1/p' \"$latest_probe\" | tail -1)\"\ncase \"$latest_status/$latest_probe_code\" in\n  200/0)\n    gh api \"$latest_endpoint\" > \"$latest_json\"\n    python -I - \"$latest_json\" \"$GITHUB_REF_NAME\" <<'PY'\nfrom pathlib import Path\nimport json\nimport re\nimport sys\n\npattern = re.compile(r'v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)')\npayload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\ncurrent_match = pattern.fullmatch(sys.argv[2])\nlatest_tag = payload.get('tag_name')\nlatest_match = pattern.fullmatch(latest_tag) if isinstance(latest_tag, str) else None\nif (\n    current_match is None\n    or latest_match is None\n    or payload.get('draft') is not False\n    or payload.get('prerelease') is not False\n):\n    raise SystemExit('latest stable release state is invalid')\ncurrent_version = tuple(int(part) for part in current_match.groups())\nlatest_version = tuple(int(part) for part in latest_match.groups())\nif current_version <= latest_version:\n    if (\n        current_version != latest_version\n        or latest_tag != sys.argv[2]\n        or payload.get('immutable') is not True\n    ):\n        raise SystemExit('release version must be newer than latest stable release')\nPY\n    ;;\n  404/*) ;;\n  *) printf 'latest release lookup failed\\n' >&2; exit 1 ;;\nesac\nrelease_json=\"$RUNNER_TEMP/hydra-release-final.json\"\nrelease_probe=\"$RUNNER_TEMP/hydra-release-final-response\"\nrelease_endpoint=\"repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME\"\nset +e\ngh api --include \"$release_endpoint\" > \"$release_probe\" 2>&1\nrelease_probe_code=$?\nset -e\nrelease_status=\"$(sed -n 's/^HTTP\\/[^ ]* \\([0-9][0-9][0-9]\\).*/\\1/p' \"$release_probe\" | tail -1)\"\ncase \"$release_status/$release_probe_code\" in\n  200/0) gh api \"$release_endpoint\" > \"$release_json\" ;;\n  404/*)\n    release_pages=\"${release_probe}.pages\"\n    gh api --paginate --slurp \"repos/$GITHUB_REPOSITORY/releases?per_page=100\" > \"$release_pages\"\n    python -I - \"$release_pages\" \"$GITHUB_REF_NAME\" \"$release_json\" <<'PY'\nfrom pathlib import Path\nimport json\nimport sys\n\npages = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\ntag = sys.argv[2]\nif not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):\n    raise SystemExit('release list response is invalid')\nmatches = []\nfor page in pages:\n    for release in page:\n        if not isinstance(release, dict) or not isinstance(release.get('tag_name'), str):\n            raise SystemExit('release list response is invalid')\n        if release['tag_name'] == tag:\n            matches.append(release)\nif len(matches) > 1:\n    raise SystemExit('release tag is ambiguous')\nif matches:\n    release = matches[0]\n    release_id = release.get('id')\n    if (\n        isinstance(release_id, bool)\n        or not isinstance(release_id, int)\n        or release_id <= 0\n        or not isinstance(release.get('draft'), bool)\n        or not isinstance(release.get('prerelease'), bool)\n        or not isinstance(release.get('assets'), list)\n    ):\n        raise SystemExit('release candidate is invalid')\n    Path(sys.argv[3]).write_text(json.dumps(release), encoding='utf-8')\nPY\n    ;;\n  *) printf 'release lookup failed\\n' >&2; exit 1 ;;\nesac\nif [ ! -s \"$release_json\" ]; then\n  printf 'draft release was not found\\n' >&2\n  exit 1\nfi\nimmutable_json=\"$RUNNER_TEMP/hydra-immutable-releases.json\"\ngh api --method GET \"repos/$GITHUB_REPOSITORY/immutable-releases\" > \"$immutable_json\"\npython -I - \"$immutable_json\" <<'PY'\nfrom pathlib import Path\nimport json\nimport sys\n\npayload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\nif not isinstance(payload, dict) or payload.get('enabled') is not True:\n    raise SystemExit('repository immutable releases are not enabled')\nPY\nremote_assets=\"$RUNNER_TEMP/hydra-final-remote-assets\"\nrelease_metadata=\"$RUNNER_TEMP/hydra-final-release-metadata\"\nrelease_state=\"$RUNNER_TEMP/hydra-final-release-state\"\npython -I - \"$release_json\" \"$GITHUB_REF_NAME\" \"$remote_assets\" \"$release_metadata\" \"$release_state\" <<'PY'\nfrom pathlib import Path\nimport json\nimport re\nimport sys\n\npayload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\ntag = sys.argv[2]\nmatch = re.fullmatch(r'v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)', tag)\nif match is None or payload.get('tag_name') != tag:\n    raise SystemExit('release tag mismatch')\nif payload.get('prerelease') is not False:\n    raise SystemExit('draft release is required; published releases are immutable; prerelease is not allowed')\nif payload.get('draft') is True:\n    release_state = 'draft'\nelif payload.get('draft') is False and payload.get('immutable') is True:\n    release_state = 'published'\nelse:\n    raise SystemExit('draft release is required; published releases are immutable; prerelease is not allowed')\nrelease_id = payload.get('id')\nif isinstance(release_id, bool) or not isinstance(release_id, int) or release_id <= 0:\n    raise SystemExit('release candidate is invalid')\nversion = tag[1:]\nexpected = sorted([\n    *(f'hydra-codex-{version}-{target}.tar.gz' for target in (\n        'darwin-arm64', 'darwin-x86_64', 'linux-x86_64'\n    )),\n    'SHA256SUMS',\n])\nassets = payload.get('assets')\nif not isinstance(assets, list):\n    raise SystemExit('remote release asset inventory is invalid')\nvalidated = []\nfor asset in assets:\n    if not isinstance(asset, dict):\n        raise SystemExit('remote release asset inventory is invalid')\n    name = asset.get('name')\n    asset_id = asset.get('id')\n    if (\n        not isinstance(name, str)\n        or name not in expected\n        or isinstance(asset_id, bool)\n        or not isinstance(asset_id, int)\n        or asset_id <= 0\n    ):\n        raise SystemExit('remote release asset inventory is invalid')\n    validated.append((name, asset_id))\nif (\n    sorted(name for name, _ in validated) != expected\n    or len(validated) != len({asset_id for _, asset_id in validated})\n):\n    raise SystemExit('remote release asset inventory is invalid')\nPath(sys.argv[3]).write_text(''.join(f'{asset_id}\\t{name}\\n' for name, asset_id in sorted(validated)), encoding='ascii')\nPath(sys.argv[4]).write_text(f'{release_id}\\n', encoding='ascii')\nPath(sys.argv[5]).write_text(f'{release_state}\\n', encoding='ascii')\nPY\nrelease_id=\"$(cat \"$release_metadata\")\"\nremote_dir=\"$RUNNER_TEMP/hydra-final-assets\"\nrm -rf \"$remote_dir\"\nmkdir \"$remote_dir\"\nwhile IFS=$'\\t' read -r asset_id name; do\n  gh api -H \"Accept: application/octet-stream\" -H \"X-GitHub-Api-Version: 2022-11-28\" \"repos/$GITHUB_REPOSITORY/releases/assets/$asset_id\" > \"$remote_dir/$name\"\ndone < \"$remote_assets\"\npython -I - \"$remote_assets\" \"$remote_dir\" dist <<'PY'\nfrom hashlib import sha256\nfrom pathlib import Path\nimport sys\n\nassets = [line.split('\\t', 1) for line in Path(sys.argv[1]).read_text(encoding='ascii').splitlines()]\nnames = [name for _, name in assets]\nremote = Path(sys.argv[2])\nlocal = Path(sys.argv[3])\ninventory = list(remote.iterdir())\nif (\n    sorted(path.name for path in inventory) != sorted(names)\n    or any(path.is_symlink() or not path.is_file() for path in inventory)\n):\n    raise SystemExit('remote release asset inventory is invalid')\nfor name in names:\n    if sha256((remote / name).read_bytes()).digest() != sha256((local / name).read_bytes()).digest():\n        raise SystemExit('remote asset checksum mismatch')\nPY\nif [ \"$(cat \"$release_state\")\" = \"published\" ]; then\n  if [ ! -s \"$latest_json\" ]; then\n    printf 'published release recovery is not latest\\n' >&2\n    exit 1\n  fi\n  python -I - \"$latest_json\" \"$release_json\" \"$GITHUB_REF_NAME\" <<'PY'\nfrom pathlib import Path\nimport json\nimport sys\n\nlatest = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\nrelease = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))\nif (\n    latest.get('id') != release.get('id')\n    or latest.get('tag_name') != sys.argv[3]\n    or latest.get('draft') is not False\n    or latest.get('prerelease') is not False\n    or latest.get('immutable') is not True\n):\n    raise SystemExit('published release recovery is not latest')\nPY\n  exit 0\nfi\npublished_json=\"$RUNNER_TEMP/hydra-release-published.json\"\ngh api --method PATCH -F draft=false -f make_latest=true \"repos/$GITHUB_REPOSITORY/releases/$release_id\" > \"$published_json\"\npython -I - \"$published_json\" \"$GITHUB_REF_NAME\" \"$release_id\" \"$remote_assets\" <<'PY'\nfrom pathlib import Path\nimport json\nimport sys\n\npayload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))\nexpected_id = int(sys.argv[3])\nexpected_assets = {\n    name: int(asset_id)\n    for asset_id, name in (\n        line.split('\\t', 1)\n        for line in Path(sys.argv[4]).read_text(encoding='ascii').splitlines()\n    )\n}\nassets = payload.get('assets')\nif (\n    payload.get('id') != expected_id\n    or payload.get('tag_name') != sys.argv[2]\n    or payload.get('draft') is not False\n    or payload.get('prerelease') is not False\n    or payload.get('immutable') is not True\n    or not isinstance(assets, list)\n):\n    raise SystemExit('published release state is invalid')\npublished_assets = {}\nfor asset in assets:\n    if not isinstance(asset, dict):\n        raise SystemExit('published release state is invalid')\n    name = asset.get('name')\n    asset_id = asset.get('id')\n    if not isinstance(name, str) or isinstance(asset_id, bool) or not isinstance(asset_id, int):\n        raise SystemExit('published release state is invalid')\n    if name in published_assets:\n        raise SystemExit('published release state is invalid')\n    published_assets[name] = asset_id\nif published