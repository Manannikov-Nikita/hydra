[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-codex"
dynamic = ["version"]
description = "Local, privacy-preserving telemetry and evidence for Codex."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/Manannikov-Nikita/hydra"
Issues = "https://github.com/Manannikov-Nikita/hydra/issues"

[project.optional-dependencies]
test = [
    "build>=1.2",
    "setuptools>=68",
]
release = [
    "pyinstaller==6.21.0",
]

[project.scripts]
hydra-codex = "hydra_codex.__main__:main"
hydra-codex-hook = "hydra_codex.hook_runtime:main"
hydra-codex-mcp = "hydra_codex.mcp_server:main"
hydra-codex-plugin = "hydra_codex.plugin_bundle:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "hydra_codex.__version__"}

[tool.setuptools.package-data]
hydra_codex = [
    "dashboard_assets/*.html",
    "dashboard_assets/*.css",
    "dashboard_assets/*.js",
    "dashboard_assets/views/*.js",
]

[tool.setuptools.data-files]
"share/hydra-codex/.agents/plugins" = [
    ".agents/plugins/marketplace.json",
]
"share/hydra-codex/plugins/hydra-codex" = [
    "plugins/hydra-codex/.mcp.json",
    "plugins/hydra-codex/README.md",
]
"share/hydra-codex/plugins/hydra-codex/.codex-plugin" = [
    "plugins/hydra-codex/.codex-plugin/*",
]
"share/hydra-codex/plugins/hydra-codex/hooks" = [
    "plugins/hydra-codex/hooks/*",
]
"share/hydra-codex/plugins/hydra-codex/skills/hydra-report" = [
    "plugins/hydra-codex/skills/hydra-report/SKILL.md",
]
"share/hydra-codex/plugins/hydra-codex/skills/hydra-report/agents" = [
    "plugins/hydra-codex/skills/hydra-report/agents/*",
]
"share/hydra-codex/plugins/hydra-codex/skills/hydra-report/references" = [
    "plugins/hydra-codex/skills/hydra-report/references/*",
]
