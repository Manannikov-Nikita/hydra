[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-codex"
version = "0.1.0"
description = "Private, hybrid telemetry contracts for Codex work."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hydra-codex = "hydra_codex.__main__:main"
hydra-codex-hook = "hydra_codex.hook_runtime:main"
hydra-codex-mcp = "hydra_codex.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
